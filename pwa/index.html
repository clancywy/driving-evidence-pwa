<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="行驶留证">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>行驶留证</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=5">
  <script src="./app-core.js?v=5" defer></script>
  <script src="./app.js?v=5" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="top-bar">
      <div class="title-row">
        <h1 id="screenTitle">行驶中</h1>
      </div>
      <div class="segmented" role="tablist" aria-label="页面切换">
        <button id="drivingTab" class="is-active" type="button" role="tab" aria-selected="true">行驶中</button>
        <button id="processTab" type="button" role="tab" aria-selected="false">处理记录</button>
      </div>
    </header>

    <section id="drivingScreen" class="screen is-active" aria-label="行驶中">
      <section class="clock-panel" aria-live="polite">
        <p id="currentDate" class="date-text">--</p>
        <time id="currentTime" class="time-text" datetime="">--:--:--</time>
      </section>

      <section class="map-panel">
        <div class="section-line">
          <h2>当前位置</h2>
          <span id="gpsStatus" class="status-pill status-waiting">定位中</span>
        </div>
        <p id="gpsDetail" class="detail-text">正在请求定位权限</p>
        <div id="currentMap" class="map-frame">
          <div id="currentTileMap" class="tile-map" aria-label="当前位置地图"></div>
          <div class="map-pin" aria-hidden="true"></div>
          <div id="currentMapPlaceholder" class="map-placeholder">等待定位</div>
        </div>
      </section>

      <section class="last-panel" aria-live="polite">
        <span>最近保存</span>
        <strong id="lastSavedText">还没有记录</strong>
      </section>

      <button id="quickSaveButton" class="save-button" type="button">保存当前时间</button>
    </section>

    <section id="processScreen" class="screen" aria-label="处理记录">
      <div class="section-line process-heading">
        <h2>处理记录</h2>
        <span id="recordSummary" class="status-pill">0 条</span>
      </div>
      <div id="emptyState" class="empty-state">暂无记录</div>
      <div id="recordList" class="record-list"></div>
    </section>

    <div class="home-indicator" aria-hidden="true"></div>
  </main>
</body>
</html>
